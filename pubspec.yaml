name: sakaynow_buenatoda
description: "A new Flutter project."
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  firebase_core: ">=4.6.0 <4.9.0"
  firebase_auth: ">=6.3.0 <6.6.0"
  cloud_firestore: ">=6.2.0 <6.5.0"
  cloud_functions: ^6.0.2
  firebase_storage: ">=13.2.0 <13.5.0"
  image_picker: ^1.1.2
  shared_preferences: ^2.3.2
  google_fonts: ^6.1.0
  google_maps_flutter: ^2.14.2
  geolocator: ^14.0.2
  http: ^1.6.0
  flutter_dotenv: ^6.0.1
  url_launcher: ^6.3.2
  web: ^1.1.1
  firebase_messaging: ">=16.2.1 <16.5.0"
  flutter_local_notifications: ^20.1.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.7
  lottie: ^3.3.1
  local_auth: ^2.3.0



dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  fake_cloud_firestore: ^4.1.1

flutter:
  uses-material-design: true

  assets:
    - .env
    - assets/images/
    - assets/google_fonts/
    - assets/animations/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/logo.jpg"
  adaptive_icon_background: "#ffffff"
  adaptive_icon_foreground: "assets/images/logo.jpg"

flutter_native_splash:
  color: "#ffffff"
  image: assets/images/logo.jpg
  android: true
  ios: true
  web: false
